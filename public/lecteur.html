<!doctype html>
<html lang="fr">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="theme-color" content="#101713">
 <title>Souffle — Lecture</title>
 <link rel="stylesheet" href="/lecteur.css">
</head>
<body>
 <header id="reader-header">
  <a href="/">← Éditeur</a><span id="title">Lecture d’essai</span><span class="badge">LECTEUR · LOCAL</span>
 </header>
 <main id="viewport" aria-label="Texte du téléprompteur" title="Toucher pour lire ou mettre en pause. Glisser pour faire défiler."><div id="text-track"><article id="text"></article></div></main>
 <div class="guide" aria-hidden="true"></div>
 <div id="countdown" aria-live="assertive"></div>
 <footer id="reader-settings" aria-label="Réglages du téléprompteur">
  <div class="settings-handle"><button id="hide-settings" aria-label="Replier les réglages" title="Replier les réglages" aria-expanded="true" aria-controls="reader-settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div class="settings-grid">
   <section class="settings-section playback-section" aria-labelledby="playback-heading">
    <h2 id="playback-heading">Lecture</h2>
    <div class="playback-fields">
     <div class="control-field speed-control" role="group" aria-labelledby="speed-label">
      <span id="speed-label" class="field-label">Vitesse</span>
      <div class="speed-stepper">
       <button id="speed-minus" aria-label="Diminuer la vitesse">−</button>
       <input id="speed-number" type="number" inputmode="numeric" min="5" max="120" step="1" aria-label="Vitesse personnalisée en pixels par seconde">
       <span class="speed-unit">px/s</span>
       <button id="speed-plus" aria-label="Augmenter la vitesse">+</button>
      </div>
      <input id="speed" type="range" min="5" max="120" step="1" aria-label="Vitesse de défilement">
     </div>
     <label class="control-field" for="delay"><span class="field-label">Décompte</span>
      <select id="delay"><option value="0">Aucun</option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option></select>
     </label>
    </div>
    <div class="transport-row">
     <button id="restart" aria-label="Revenir au début" title="Revenir au début"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
     <button id="test-speed" aria-label="Tester la vitesse" title="Tester la vitesse sans décompte" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 18a9 9 0 1 1 16 0M12 13l5-6M5 10l2 1M12 4v2M19 10l-2 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="13" r="2" fill="currentColor"/></svg><span id="test-speed-label">Tester</span></button>
     <button id="play" class="primary">▷ Lire</button>
    </div>
   </section>
   <section class="settings-section text-section" aria-labelledby="text-heading">
    <h2 id="text-heading">Texte</h2>
    <div class="text-fields">
     <div class="control-field size-control" role="group" aria-labelledby="size-label">
      <span id="size-label" class="field-label">Taille du texte</span>
      <div class="speed-stepper">
       <button id="size-minus" aria-label="Diminuer la taille du texte">−</button>
       <input id="size-number" type="number" inputmode="numeric" min="28" max="100" step="1" aria-label="Taille personnalisée du texte en pixels">
       <span class="speed-unit">px</span>
       <button id="size-plus" aria-label="Augmenter la taille du texte">+</button>
      </div>
     </div>
     <label class="control-field" for="font"><span class="field-label">Police</span>
      <select id="font"><option value="sans-serif">Sans sérif</option><option value="Georgia">Georgia</option><option value="original">Originale</option></select>
     </label>
    </div>
    <label class="check-control"><input id="proportional" type="checkbox"><span>Tailles relatives du script</span></label>
   </section>
   <section class="settings-section display-section" aria-labelledby="display-heading">
    <h2 id="display-heading">Affichage</h2>
    <span class="field-label" id="mirror-label">Miroirs</span>
    <div class="mirror-controls" role="group" aria-labelledby="mirror-label">
     <button id="mirror-x" aria-label="Miroir horizontal" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v18M3 6v12l5-6-5-6Zm18 0v12l-5-6 5-6Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Horizontal</span></button>
     <button id="mirror-y" aria-label="Miroir vertical" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12h18M6 3h12l-6 5-6-5Zm0 18h12l-6-5-6 5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Vertical</span></button>
    </div>
   </section>
  </div>
 </footer>
 <div id="reader-minibar" role="group" aria-label="Commandes de lecture" hidden>
  <a id="reader-exit" href="/" aria-label="Retour à l’éditeur" title="Retour à l’éditeur"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12H4m6-6-6 6 6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <button id="immersive-play" aria-label="Reprendre la lecture" title="Reprendre la lecture">
   <svg id="mini-play-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 11 7-11 7V5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
   <svg id="mini-pause-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
   <svg id="mini-cancel-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="display:none"><path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <button id="show-settings" aria-label="Afficher les réglages" title="Afficher les réglages" aria-expanded="false" aria-controls="reader-settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 15 6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
 </div>
 <script src="/lecteur-gestures.js"></script><script src="/lecteur-motion.js"></script><script src="/lecteur.js"></script>
</body>
</html>
